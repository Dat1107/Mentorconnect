function Cht({type,labels,sets,th}){
 const r=useRef();
 useEffect(()=>{
  const cs=getComputedStyle(document.documentElement),g=k=>cs.getPropertyValue(k).trim(),cols=[g('--p'),g('--p2')],m=g('--mut'),bd=g('--bd');
  const rad=type==='radar',sc=rad?{r:{min:0,max:100,ticks:{display:false},grid:{color:bd},angleLines:{color:bd},pointLabels:{color:m,font:{size:11}}}}:{y:{min:0,max:100,ticks:{color:m},grid:{color:bd}},x:{ticks:{color:m},grid:{display:false}}};
  const c=new Chart(r.current,{type,data:{labels,datasets:sets.map((s,i)=>({label:s[0],data:s[1],borderColor:cols[i],backgroundColor:cols[i]+(rad?'33':'cc'),borderWidth:2,borderRadius:6,pointBackgroundColor:cols[i]}))},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:m}}},scales:sc}});
  return()=>c.destroy();
 },[type,th,JSON.stringify(sets)]);
 return html`<div style=${{height:290,position:'relative'}}><canvas ref=${r}></canvas></div>`;
}

function Dash({role,tasks,aps,th,go}){

 const sk=['Kỹ năng mềm','Chuyên môn','Kỷ luật','Tiếng Anh','Tư duy phản biện','Làm việc nhóm'];
 return html`<div className="space-y-4">
 <div className="grad rounded-2xl p-5"><div className="text-xl font-bold">Xin chào, ${role==='mentee'?ME:MR} 👋</div><div className="opacity-90 text-sm mt-1">${role==='mentee'?'Hôm nay bạn có 1 task đang chờ mentor duyệt và 1 buổi hẹn trong tuần này.':`Có ${rv.length} bài nộp đang chờ bạn chấm điểm và phản hồi.`}</div></div>
 <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">${St.map(s=>html`<div className="card p-4 flex items-center gap-3" key=${s[1]}><div className="grad w-11 h-11 rounded-xl flex items-center justify-center">${I(s[0])}</div><div><div className="text-xs mut">${s[1]}</div><div className="font-bold">${s[2]}</div></div></div>`)}</div>
 <div className="card p-4"><div className="flex justify-between items-center mb-2"><b>${role==='mentee'?'Phát triển kỹ năng':'Tiến độ các mentee (%)'}</b>${role==='mentee'&&html`<div className="flex gap-1">${['radar','bar'].map(t=>html`<button key=${t} className=${'btn2 '+(ty===t?'act':'')} onClick=${()=>sty(t)}>${t==='radar'?'Radar':'Cột'}</button>`)}</div>`}</div>
 ${role==='mentee'?html`<${Cht} th=${th} type=${ty} labels=${sk} sets=${[['Hiện tại',[72,65,80,58,70,76]],['Mục tiêu học kỳ',[85,85,90,80,85,85]]]}/>`:html`<${Cht} th=${th} type="bar" labels=${MENTEES} sets=${[['Hoàn thành task',[78,64,52,90]],['Chuyên cần',[85,70,60,95]]]}/>`}</div>

}

function Dir({role,req,setReq,go,toast,reqs,setReqs}){
 const [q,sq]=useState(''),[f,sf]=useState(''),[c,sc]=useState('');
 if(role==='mentor')return html`<div className="space-y-3"><h2 className="font-bold text-lg">Yêu cầu kết nối từ sinh viên</h2>${reqs.length?reqs.map(r=>html`<div key=${r.n} className="card p-4 flex items-center gap-3 flex-wrap"><${Av} n=${r.n}/><div className="flex-1 min-w-[160px]"><b>${r.n}</b><div className="text-xs mut">${r.s}</div><div className="text-sm mt-1">“${r.g}”</div></div><button className="btn" onClick=${()=>{setReqs(reqs.filter(x=>x!==r));toast('Đã chấp nhận '+r.n)}}>Chấp nhận</button><button className="btn2" onClick=${()=>setReqs(reqs.filter(x=>x!==r))}>Từ chối</button></div>`):html`<div className="card p-6 text-center mut">Chưa có yêu cầu mới. Bạn đã xử lý hết rồi!</div>`}</div>`;
 const L=M.filter(m=>(m.n+m.r+m.s.join()).toLowerCase().includes(q.toLowerCase())&&(!f||m.f===f)&&(!c||m.co===c));
 const opt=a=>a.map(x=>html`<option key=${x}>${x}</option>`);
 return html`<div className="space-y-3"><div className="grid grid-cols-1 sm:grid-cols-3 gap-2"><input className="inp" placeholder="🔍 Tìm theo tên, kỹ năng..." value=${q} onChange=${e=>sq(e.target.value)}/><select className="inp" value=${f} onChange=${e=>sf(e.target.value)}><option value="">Mọi lĩnh vực</option>${opt([...new Set(M.map(m=>m.f))])}</select><select className="inp" value=${c} onChange=${e=>sc(e.target.value)}><option value="">Mọi doanh nghiệp</option>${opt([...new Set(M.map(m=>m.co))])}</select></div>
 <div className="grid grid-cols-1 lg:grid-cols-2 gap-3">${L.map(m=>html`<div key=${m.n} className="card p-4"><div className="flex gap-3"><${Av} n=${m.n} s=${52}/><div className="flex-1"><b>${m.n}</b><div className="text-sm mut">${m.r}</div><div className="mt-1 flex gap-1 flex-wrap"><span className="bdg">${m.co}</span><span className="bdg">${m.f}</span><span className="text-xs mut">${I('fa-star','text-amber-400')} ${m.rt}</span></div></div></div><div className="text-xs mut mt-2">${m.s.join(' • ')}</div><div className="flex gap-2 mt-3"><button className=${req.includes(m.n)?'btn2 flex-1':'btn flex-1'} onClick=${()=>{if(!req.includes(m.n)){setReq([...req,m.n]);toast('Đã gửi yêu cầu tới '+m.n)}}}>${req.includes(m.n)?'Đã gửi yêu cầu':'Nộp yêu cầu kết nối'}</button><button className="btn2" onClick=${()=>go('sch',m.n)}>${I('fa-calendar-plus')} Đặt lịch hẹn</button></div></div>`)}</div>${!L.length&&html`<div className="card p-6 text-center mut">Không tìm thấy mentor phù hợp. Thử bỏ bớt bộ lọc.</div>`}</div>`;

function Kan({role,tasks,setTasks,toast}){

 const set=(id,x)=>setTasks(ts=>ts.map(t=>t.id===id?{...t,...x}:t));
 const open=(k,t)=>{sm({k,t});sa('');sb(8)};
 const ok=()=>{const t=m.t;
  if(m.k==='sub'){set(t.id,{col:'review',sub:a||'(Không có ghi chú)'});toast('Đã nộp bài, chờ mentor duyệt')}

  sm(null)};

  ${m.k==='new'&&html`<select className="inp" value=${o} onChange=${e=>so(e.target.value)}>${MENTEES.map(x=>html`<option key=${x}>${x}</option>`)}</select>`}
  ${m.k==='gr'&&html`<div className="text-sm p-2 rounded-lg" style=${{background:'var(--bg)'}}>${m.t.sub}</div><label className="text-sm">Điểm: <b>${b}</b>/10<input type="range" min="1" max="10" value=${b} onChange=${e=>sb(e.target.value)} className="w-full"/></label>`}
  <textarea className="inp" rows="4" placeholder=${m.k==='sub'?'Mô tả kết quả hoặc dán link bài làm...':m.k==='gr'?'Nhận xét cho mentee...':'Tên công việc'} value=${a} onChange=${e=>sa(e.target.value)}></textarea>
  <button className="btn w-full" onClick=${ok}>${m.k==='sub'?'Nộp bài':m.k==='gr'?'Lưu chấm điểm':'Giao task'}</button></div><//>`}</div>`;
}

 const add=()=>{if(!f.loc||!f.note)return toast('Vui lòng nhập địa điểm/link và nội dung');
  setAps([...aps,{id:Date.now(),mr:role==='mentee'?f.who:MR,me:role==='mentee'?ME:f.who,ty:f.ty,d:f.d,t:f.t,loc:f.loc,note:f.note}].sort((a,b)=>(a.d+a.t).localeCompare(b.d+b.t)));sf({...f,loc:'',note:''});toast('Đã đặt lịch hẹn')};

 <select className="inp" value=${f.who} onChange=${u('who')}>${names.map(x=>html`<option key=${x}>${x}</option>`)}</select>
 <div className="grid grid-cols-2 gap-2">${[['on','fa-video','Online (Google Meet)'],['off','fa-mug-hot','Trực tiếp']].map(([k,ic,n])=>html`<button key=${k} className=${'btn2 '+(f.ty===k?'act':'')} onClick=${()=>sf({...f,ty:k,loc:''})}>${I(ic)} ${n}</button>`)}</div>
 <div className="grid grid-cols-2 gap-2"><input type="date" className="inp" value=${f.d} onChange=${u('d')}/><input type="time" className="inp" value=${f.t} onChange=${u('t')}/></div>
 <input className="inp" placeholder=${f.ty==='on'?'Link Google Meet':'Quán cà phê / văn phòng'} value=${f.loc} onChange=${u('loc')}/>
 <textarea className="inp" rows="3" placeholder="Nội dung trao đổi" value=${f.note} onChange=${u('note')}></textarea><button className="btn w-full" onClick=${add}>Đặt lịch</button></div>

}

function Chat({chats,setChats}){
 const [id,sid]=useState('a'),[q,sq]=useState(''),[k,sk]=useState(''),[tx,stx]=useState(''),[op,sop]=useState(false),act=useRef('a'),end=useRef();
 const cur=chats.find(c=>c.id===id);

  setChats(cs=>cs.map(c=>c.id===i?{...c,m:[...c.m,[1,t]]}:c));
  setTimeout(()=>{const r=REPLY[kd][Math.floor(Math.random()*3)];setChats(cs=>cs.map(c=>c.id===i?{...c,m:[...c.m,[0,r]],u:act.current===i?0:c.u+1}:c))},1300)};

 <div className="overflow-y-auto flex-1">${L.map(c=>html`<button key=${c.id} onClick=${()=>pick(c.id)} className=${'w-full flex gap-3 p-3 text-left items-center '+(c.id===id?'act':'')}><${Av} n=${c.n}/><div className="flex-1 min-w-0"><div className="flex justify-between"><b className="text-sm truncate">${c.n}</b>${c.u>0&&html`<span className="grad rounded-full text-xs px-2">${c.u}</span>`}</div><div className="text-xs mut truncate">${c.m[c.m.length-1][1]}</div></div></button>`)}</div></div>
 <div className=${'flex-1 flex-col min-w-0 '+(op?'flex':'hidden md:flex')}><div className="p-3 border-b flex items-center gap-3" style=${{borderColor:'var(--bd)'}}><button className="md:hidden" onClick=${()=>sop(false)}>${I('fa-arrow-left')}</button><${Av} n=${cur.n} s=${38}/><div><b className="text-sm">${cur.n}</b> <span className="bdg">${cur.k}</span><div className="text-xs mut">${cur.s}</div></div></div>
 <div className="flex-1 overflow-y-auto p-3 space-y-2">${cur.m.map((m,i)=>html`<div key=${i} className=${'flex '+(m[0]?'justify-end':'')}><div className=${'max-w-[80%] px-3 py-2 rounded-2xl text-sm '+(m[0]?'grad':'')} style=${m[0]?{}:{background:'var(--bg)'}}>${m[1]}</div></div>`)}<div ref=${end}></div></div>
 <div className="p-3 flex gap-2 border-t" style=${{borderColor:'var(--bd)'}}><input className="inp" placeholder="Nhập tin nhắn..." value=${tx} onChange=${e=>stx(e.target.value)} onKeyDown=${e=>e.key==='Enter'&&send()}/><button className="btn" onClick=${send}>${I('fa-paper-plane')}</button></div></div></div>`;
}

function App(){

 return html`<div>

  <main className="flex-1 min-w-0 p-3 md:p-4 pb-24 md:pb-6"><h1 className="font-bold text-xl mb-3">${NAV.find(n=>n[0]===pg)[2]}</h1>${P[pg]}</main></div>
